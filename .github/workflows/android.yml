name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  # The cached key is the canonical signing key for this project. Do not replace it unless you
  # are willing to uninstall the installed app once (Android forbids signature changes).
  FALLBACK_KEYSTORE_PASSWORD: personal-keystore
  FALLBACK_KEY_ALIAS: personal
  FALLBACK_KEY_PASSWORD: personal-keystore
  SIGNING_KEYSTORE_CACHE_KEY: personal-signing-keystore-v1

jobs:
  build:
    name: Build release APK
    # Pinned: 'ubuntu-latest' is migrating to Ubuntu 26 (actions/runner-images#14748).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      # Wrapper validation is built into setup-gradle (v4+), no separate action needed.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore canonical signing keystore
        id: keystore-cache
        uses: actions/cache@v6
        with:
          path: signing/app.keystore
          key: ${{ env.SIGNING_KEYSTORE_CACHE_KEY }}

      - name: Fail if canonical signing keystore is missing
        if: ${{ steps.keystore-cache.outputs.cache-hit != 'true' }}
        run: |
          echo "::error::Missing cached signing keystore '${SIGNING_KEYSTORE_CACHE_KEY}'."
          echo "::error::Do not generate a replacement key: installed APKs would get a signature mismatch."
          echo "::error::Restore the original Actions cache or provide the original keystore before rebuilding."
          exit 1

      - name: Show signing certificate fingerprint
        run: |
          keytool -list -v \
            -keystore signing/app.keystore \
            -storetype PKCS12 \
            -storepass "$FALLBACK_KEYSTORE_PASSWORD" \
            -alias "$FALLBACK_KEY_ALIAS" | grep "SHA256:"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --warning-mode=all
        env:
          # Absolute path: the Gradle signing config resolves relative paths against the
          # app module directory, not the repo root.
          FL_SIGNING_STORE_FILE: ${{ github.workspace }}/signing/app.keystore
          FL_SIGNING_STORE_PASSWORD: ${{ env.FALLBACK_KEYSTORE_PASSWORD }}
          FL_SIGNING_KEY_ALIAS: ${{ env.FALLBACK_KEY_ALIAS }}
          FL_SIGNING_KEY_PASSWORD: ${{ env.FALLBACK_KEY_PASSWORD }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: keyboard-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
