name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  # Fallback signing credentials for the auto-generated personal keystore.
  # If you prefer to manage your own signing key, add the following repository secrets
  # (see README.md, section "Signing") and this workflow will use them instead:
  #   SIGNING_KEYSTORE_BASE64, SIGNING_KEYSTORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD
  FALLBACK_KEYSTORE_PASSWORD: personal-keystore
  FALLBACK_KEY_ALIAS: personal
  FALLBACK_KEY_PASSWORD: personal-keystore

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Determine signing source
        id: signing
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "use-secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "use-secrets=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}

      - name: Decode signing keystore from secrets (if provided)
        if: ${{ steps.signing.outputs.use-secrets == 'true' }}
        run: |
          mkdir -p signing
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > signing/app.keystore

      - name: Restore auto-generated signing keystore
        if: ${{ steps.signing.outputs.use-secrets != 'true' }}
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: signing/app.keystore
          key: personal-signing-keystore-v1

      - name: Generate signing keystore (first run only)
        if: ${{ steps.signing.outputs.use-secrets != 'true' && steps.keystore-cache.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p signing
          keytool -genkeypair -v \
            -keystore signing/app.keystore \
            -alias "$FALLBACK_KEY_ALIAS" \
            -keyalg RSA -keysize 4096 -validity 10950 \
            -storepass "$FALLBACK_KEYSTORE_PASSWORD" \
            -keypass "$FALLBACK_KEY_PASSWORD" \
            -dname "CN=Personal Keyboard"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          # Absolute path: the Gradle signing config resolves relative paths against the
          # app module directory, not the repo root.
          FL_SIGNING_STORE_FILE: ${{ github.workspace }}/signing/app.keystore
          FL_SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD || env.FALLBACK_KEYSTORE_PASSWORD }}
          FL_SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || env.FALLBACK_KEY_ALIAS }}
          FL_SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD || env.FALLBACK_KEY_PASSWORD }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
